<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>UR Industries - Gear Trains</title>
  <style>
    /* RESET & BASE — no extra styling, no colors, no lines, no emojis */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: white;
      color: black;
      line-height: 1.4;
      padding: 1.5rem;
      max-width: 780px;
      margin: 0 auto;
    }

    /* main container: purely structural, no borders, no colors */
    .container {
      width: 100%;
    }

    /* header: plain text, no decorative elements */
    .brand {
      margin-bottom: 2rem;
      text-align: left;
    }

    .brand h1 {
      font-weight: 600;
      font-size: 1.75rem;
      letter-spacing: -0.01em;
      margin-bottom: 0.25rem;
    }

    .brand .tagline {
      font-size: 0.9rem;
      opacity: 0.75;
      font-weight: normal;
      margin-top: 0.2rem;
    }

    /* subhead: simple description */
    .description {
      margin-bottom: 1.8rem;
      font-size: 1rem;
      border: none;
      background: none;
    }

    /* buttons grid: no colors, no gradients, no shadows, just functional */
    .buttons-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    /* plain button style: no background colors (keeps default browser gray/white),
       no extra borders except standard, no rounded corners if not necessary.
       We keep only minimal spacing and pointer. */
    .gear-btn {
      display: block;
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 500;
      text-align: left;
      background: #f9f9f9;       /* extremely light neutral, not a "color" per se – for readability */
      border: 1px solid #ccc;     /* neutral border, not colored */
      cursor: pointer;
      transition: none;
      color: black;
      text-decoration: none;
      line-height: 1.3;
      -webkit-appearance: none;
      appearance: none;
    }

    /* remove any hover color effect (keep plain) */
    .gear-btn:hover {
      background: #f0f0f0;   /* only subtle neutral shift, not a decorative color */
      border-color: #aaa;
    }

    .gear-btn:active {
      background: #e5e5e5;
    }

    /* optional simple note: no emojis, no lines */
    .footer-note {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      border-top: none;
      padding-top: 0.5rem;
      color: #4a4a4a;
    }

    /* make it very minimal: no box shadows, no gradients, no extras */
    hr, .separator {
      display: none;
    }

    /* accessibility: focus ring but no extra colors (default blue outline, but that's system) */
    .gear-btn:focus-visible {
      outline: 2px solid #000;
      outline-offset: 1px;
    }

    /* plain text only */
    a, a:visited {
      text-decoration: none;
      color: black;
    }

    /* remove any possible icon or pseudo-element */
    .gear-btn::before,
    .gear-btn::after {
      content: none;
    }

    /* ensure no emojis appear from unicode fallback */
    body, button, div, h1, p {
      font-feature-settings: normal;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="brand">
    <h1>UR Industries presents Gear trains</h1>
    <div class="tagline">precision drive systems & mechanical solutions</div>
  </div>

  <div class="description">
    Select an application below to explore gear train configurations.
  </div>

  <div class="buttons-grid">
    <!-- Simple gear train -->
    <button class="gear-btn" data-url="https://urfrequency.github.io/urfrequency/gears/gr">
      Simple gear train
    </button>

    <!-- Complex gear train -->
    <button class="gear-btn" data-url="https://urfrequency.github.io/urfrequency/gears/cgr">
      Complex gear train
    </button>

    <!-- Cars -->
    <button class="gear-btn" data-url="https://urfrequency.github.io/urfrequency/gears/car">
      Cars
    </button>

    <!-- Railway -->
    <button class="gear-btn" data-url="https://urfrequency.github.io/urfrequency/gears/r">
      Railway
    </button>

    <!-- EOT (Electric Overhead Traveling Crane) -->
    <button class="gear-btn" data-url="https://urfrequency.github.io/urfrequency/gears/eot">
      EOT
    </button>

    <!-- Industrial -->
    <button class="gear-btn" data-url="https://urfrequency.github.io/urfrequency/gears/i">
      Industrial
    </button>

    <!-- Wind Mills -->
    <button class="gear-btn" data-url="https://urfrequency.github.io/urfrequency/gears/w">
      Wind Mills
    </button>

    <!-- Aircrafts -->
    <button class="gear-btn" data-url="https://urfrequency.github.io/urfrequency/gears/s">
      Aircrafts
    </button>
  </div>

  <div class="footer-note">
    UR Industries — gear technology for mobility, energy & heavy machinery.
  </div>
</div>

<script>
  (function() {
    // Simple plain navigation: open each URL in the same tab.
    // No extra styling, no confirmations, no distractions.
    const buttons = document.querySelectorAll('.gear-btn');
    
    function handleClick(event) {
      const btn = event.currentTarget;
      const url = btn.getAttribute('data-url');
      if (url && url.trim() !== '') {
        // standard navigation (same tab, just like a normal link)
        window.location.href = url;
      } else {
        // extremely rare fallback: do nothing silently (maintain integrity)
        console.warn('no url defined for this button');
      }
    }
    
    for (let i = 0; i < buttons.length; i++) {
      const btn = buttons[i];
      // remove any previous listeners to avoid double binding (just in case)
      btn.removeEventListener('click', handleClick);
      btn.addEventListener('click', handleClick);
    }
    
    // Additionally, to ensure keyboard users and touch, no further clutter.
    // also provide simple title tooltips without extra decoration? just plain browser default
    for (let btn of buttons) {
      const text = btn.innerText.trim();
      if (text) {
        btn.setAttribute('title', `Open ${text} details`);
      }
    }
  })();
</script>
</body>
</html>
