// Bore diameter mapping (bore code to mm)
function getBoreD(boreCode) {
    if (boreCode === 0) return 10;
    if (boreCode === 1) return 12;
    if (boreCode === 2) return 15;
    if (boreCode === 3) return 17;
    return boreCode * 5;
}

// Helper to linearly interpolate between breakpoints
function interpolate(bc, breakBc, values) {
    if (bc <= breakBc[0]) return values[0];
    for (let i = 1; i < breakBc.length; i++) {
        if (bc <= breakBc[i]) {
            const t = (bc - breakBc[i-1]) / (breakBc[i] - breakBc[i-1]);
            return Math.round(values[i-1] + t * (values[i] - values[i-1]));
        }
    }
    return values[values.length - 1];
}

function drawBearing(d, D, B) {
    const scale = 1.5;
    const outerR = D/2 * scale;
    const innerR = d/2 * scale;
    const width = B * scale;
    const margin = 20;
    const svgWidth = Math.max(outerR*2 + 60, 250);
    const svgHeight = Math.max(outerR*2 + 40, 200);

    let svg = `<svg width="${svgWidth}" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="black"/>
        </marker>
      </defs>`;

    const cxPlan = outerR + 20;
    const cyPlan = outerR + 20;
    svg += `<circle cx="${cxPlan}" cy="${cyPlan}" r="${outerR}" fill="none" stroke="black" stroke-width="1.5"/>`;
    svg += `<circle cx="${cxPlan}" cy="${cyPlan}" r="${innerR}" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="4,2"/>`;
    svg += `<text x="${cxPlan}" y="${cyPlan - outerR - 8}" text-anchor="middle" font-size="11">D=${D}</text>`;
    svg += `<text x="${cxPlan}" y="${cyPlan - innerR + 14}" text-anchor="middle" font-size="10">d=${d}</text>`;

    const sideX = cxPlan + outerR + 40;
    const sideY = cyPlan - outerR;
    svg += `<rect x="${sideX}" y="${sideY}" width="${width}" height="${outerR*2}" fill="none" stroke="black" stroke-width="1.5"/>`;
    svg += `<line x1="${sideX}" y1="${sideY + outerR - innerR}" x2="${sideX + width}" y2="${sideY + outerR - innerR}" stroke="black" stroke-dasharray="4,2" stroke-width="1.2"/>`;
    svg += `<line x1="${sideX}" y1="${sideY + outerR + innerR}" x2="${sideX + width}" y2="${sideY + outerR + innerR}" stroke="black" stroke-dasharray="4,2" stroke-width="1.2"/>`;
    svg += `<line x1="${sideX}" y1="${sideY + outerR}" x2="${sideX + width}" y2="${sideY + outerR}" stroke="gray" stroke-width="0.8" stroke-dasharray="5,3"/>`;
    svg += `<line x1="${sideX}" y1="${sideY - 12}" x2="${sideX + width}" y2="${sideY - 12}" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>`;
    svg += `<text x="${sideX + width/2}" y="${sideY - 16}" text-anchor="middle" font-size="11">B=${B}</text>`;
    svg += `<line x1="${sideX - 10}" y1="${sideY}" x2="${sideX - 10}" y2="${sideY + outerR*2}" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>`;
    svg += `<text x="${sideX - 16}" y="${sideY + outerR}" text-anchor="end" font-size="11" transform="rotate(-90, ${sideX-16}, ${sideY+outerR})">D=${D}</text>`;
    svg += `<line x1="${sideX + width + 10}" y1="${sideY + outerR - innerR}" x2="${sideX + width + 10}" y2="${sideY + outerR + innerR}" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>`;
    svg += `<text x="${sideX + width + 14}" y="${sideY + outerR}" text-anchor="start" font-size="11">d=${d}</text>`;

    svg += `</svg>`;
    return svg;
}

// --------------------------------------------------------------
// 3. Display result
// --------------------------------------------------------------
function displayResult(bearing) {
    const resultArea = document.getElementById('resultArea');
    const detailsDiv = document.getElementById('bearingDetails');
    const title = document.getElementById('resultTitle');
    resultArea.classList.add('active');

    if (!bearing) {
        title.textContent = 'No bearing found';
        detailsDiv.innerHTML = '<p class="error">No matching bearing. Please refine your search.</p>';
        return;
    }
    title.textContent = 'Bearing Found';
    const svg = drawBearing(bearing.d, bearing.D, bearing.B);
    detailsDiv.innerHTML = `
        <div class="bearing-data">
            <table>
                <tr><th>Property</th><th>Value</th></tr>
                <tr><td>Code</td><td><strong>${bearing.code}</strong></td></tr>
                <tr><td>Type</td><td>${bearing.type}</td></tr>
                <tr><td>Inner diameter (d)</td><td>${bearing.d} mm</td></tr>
                <tr><td>Outer diameter (D)</td><td>${bearing.D} mm</td></tr>
                <tr><td>Width (B)</td><td>${bearing.B} mm</td></tr>
            </table>
        </div>
        <div class="bearing-drawing">
            ${svg}
        </div>
    `;
}

// --------------------------------------------------------------
// 4. Search functions
// --------------------------------------------------------------
function searchByCode() {
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (!code) {
        displayResult(null);
        return;
    }
    const bearing = bearings.find(b => b.code === code);
    displayResult(bearing);
}

function searchByDimensions() {
    const typeSelect = document.getElementById('typeSelect').value;
    const id = parseFloat(document.getElementById('idInput').value);
    const od = parseFloat(document.getElementById('odInput').value);
    const w = parseFloat(document.getElementById('wInput').value);

    if (isNaN(id) || isNaN(od) || isNaN(w)) {
        displayResult(null);
        return;
    }

    let filtered = bearings.filter(b => 
        Math.abs(b.d - id) < 0.01 && 
        Math.abs(b.D - od) < 0.01 && 
        Math.abs(b.B - w) < 0.01
    );
    if (typeSelect !== 'all') {
        filtered = filtered.filter(b => b.type === typeSelect);
    }
    if (filtered.length === 0) {
        displayResult(null);
    } else if (filtered.length === 1) {
        displayResult(filtered[0]);
    } else {
        const first = filtered[0];
        const resultArea = document.getElementById('resultArea');
        const detailsDiv = document.getElementById('bearingDetails');
        resultArea.classList.add('active');
        document.getElementById('resultTitle').textContent = `Multiple codes found (${filtered.length})`;
        const svg = drawBearing(first.d, first.D, first.B);
        let codeList = filtered.map(b => b.code + ' (' + b.type + ')').join('<br>');
        detailsDiv.innerHTML = `
            <div class="bearing-data">
                <p>Matching dimensions: d=${first.d} mm, D=${first.D} mm, B=${first.B} mm</p>
                <p><strong>Codes:</strong><br>${codeList}</p>
            </div>
            <div class="bearing-drawing">
                ${svg}
            </div>
        `;
    }
}

document.getElementById('codeInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') searchByCode();
});

document.getElementById('resultArea').classList.remove('active');
</script>
