// Bore diameter mapping (bore code to mm)
function getBoreD(boreCode) {
    if (boreCode === 0) return 10;
    if (boreCode === 1) return 12;
    if (boreCode === 2) return 15;
    if (boreCode === 3) return 17;
    return boreCode * 5;
}

// Helper to linearly interpolate between breakpoints
function interpolate(bc, breakBc, values) {
    if (bc <= breakBc[0]) return values[0];
    for (let i = 1; i < breakBc.length; i++) {
        if (bc <= breakBc[i]) {
            const t = (bc - breakBc[i-1]) / (breakBc[i] - breakBc[i-1]);
            return Math.round(values[i-1] + t * (values[i] - values[i-1]));
        }
    }
    return values[values.length - 1];
}

function drawBearing(d, D, B) {
    const scale = 1.5;
    const outerR = D/2 * scale;
    const innerR = d/2 * scale;
    const width = B * scale;
    const margin = 20;
    const svgWidth = Math.max(outerR*2 + 60, 250);
    const svgHeight = Math.max(outerR*2 + 40, 200);

    let svg = `<svg width="${svgWidth}" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="black"/>
        </marker>
      </defs>`;

    const cxPlan = outerR + 20;
    const cyPlan = outerR + 20;
    svg += `<circle cx="${cxPlan}" cy="${cyPlan}" r="${outerR}" fill="none" stroke="black" stroke-width="1.5"/>`;
    svg += `<circle cx="${cxPlan}" cy="${cyPlan}" r="${innerR}" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="4,2"/>`;
    svg += `<text x="${cxPlan}" y="${cyPlan - outerR - 8}" text-anchor="middle" font-size="11">D=${D}</text>`;
    svg += `<text x="${cxPlan}" y="${cyPlan - innerR + 14}" text-anchor="middle" font-size="10">d=${d}</text>`;

    const sideX = cxPlan + outerR + 40;
    const sideY = cyPlan - outerR;
    svg += `<rect x="${sideX}" y="${sideY}" width="${width}" height="${outerR*2}" fill="none" stroke="black" stroke-width="1.5"/>`;
    svg += `<line x1="${sideX}" y1="${sideY + outerR - innerR}" x2="${sideX + width}" y2="${sideY + outerR - innerR}" stroke="black" stroke-dasharray="4,2" stroke-width="1.2"/>`;
    svg += `<line x1="${sideX}" y1="${sideY + outerR + innerR}" x2="${sideX + width}" y2="${sideY + outerR + innerR}" stroke="black" stroke-dasharray="4,2" stroke-width="1.2"/>`;
    svg += `<line x1="${sideX}" y1="${sideY + outerR}" x2="${sideX + width}" y2="${sideY + outerR}" stroke="gray" stroke-width="0.8" stroke-dasharray="5,3"/>`;
    svg += `<line x1="${sideX}" y1="${sideY - 12}" x2="${sideX + width}" y2="${sideY - 12}" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>`;
    svg += `<text x="${sideX + width/2}" y="${sideY - 16}" text-anchor="middle" font-size="11">B=${B}</text>`;
    svg += `<line x1="${sideX - 10}" y1="${sideY}" x2="${sideX - 10}" y2="${sideY + outerR*2}" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>`;
    svg += `<text x="${sideX - 16}" y="${sideY + outerR}" text-anchor="end" font-size="11" transform="rotate(-90, ${sideX-16}, ${sideY+outerR})">D=${D}</text>`;
    svg += `<line x1="${sideX + width + 10}" y1="${sideY + outerR - innerR}" x2="${sideX + width + 10}" y2="${sideY + outerR + innerR}" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>`;
    svg += `<text x="${sideX + width + 14}" y="${sideY + outerR}" text-anchor="start" font-size="11">d=${d}</text>`;

    svg += `</svg>`;
    return svg;
}

// --------------------------------------------------------------
// 3. Display result
// --------------------------------------------------------------
function displayResult(bearing) {
    const resultArea = document.getElementById('resultArea');
    const detailsDiv = document.getElementById('bearingDetails');
    const title = document.getElementById('resultTitle');
    resultArea.classList.add('active');

    if (!bearing) {
        title.textContent = 'No bearing found';
        detailsDiv.innerHTML = '<p class="error">No matching bearing. Please refine your search.</p>';
        return;
    }
    title.textContent = 'Bearing Found';
    const svg = drawBearing(bearing.d, bearing.D, bearing.B);
    detailsDiv.innerHTML = `
        <div class="bearing-data">
            <table>
                <tr><th>Property</th><th>Value</th></tr>
                <tr><td>Code</td><td><strong>${bearing.code}</strong></td></tr>
                <tr><td>Type</td><td>${bearing.type}</td></tr>
                <tr><td>Inner diameter (d)</td><td>${bearing.d} mm</td></tr>
                <tr><td>Outer diameter (D)</td><td>${bearing.D} mm</td></tr>
                <tr><td>Width (B)</td><td>${bearing.B} mm</td></tr>
            </table>
        </div>
        <div class="bearing-drawing">
            ${svg}
        </div>
    `;
}

// --------------------------------------------------------------
// 4. Search functions
// --------------------------------------------------------------
function searchByCode() {
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (!code) {
        displayResult(null);
        return;
    }
    const bearing = bearings.find(b => b.code === code);
    displayResult(bearing);
}

function searchByDimensions() {
    const typeSelect = document.getElementById('typeSelect').value;
    const id = parseFloat(document.getElementById('idInput').value);
    const od = parseFloat(document.getElementById('odInput').value);
    const w = parseFloat(document.getElementById('wInput').value);

    if (isNaN(id) || isNaN(od) || isNaN(w)) {
        displayResult(null);
        return;
    }

    let filtered = bearings.filter(b => 
        Math.abs(b.d - id) < 0.01 && 
        Math.abs(b.D - od) < 0.01 && 
        Math.abs(b.B - w) < 0.01
    );
    if (typeSelect !== 'all') {
        filtered = filtered.filter(b => b.type === typeSelect);
    }
    if (filtered.length === 0) {
        displayResult(null);
    } else if (filtered.length === 1) {
        displayResult(filtered[0]);
    } else {
        const first = filtered[0];
        const resultArea = document.getElementById('resultArea');
        const detailsDiv = document.getElementById('bearingDetails');
        resultArea.classList.add('active');
        document.getElementById('resultTitle').textContent = `Multiple codes found (${filtered.length})`;
        const svg = drawBearing(first.d, first.D, first.B);
        let codeList = filtered.map(b => b.code + ' (' + b.type + ')').join('<br>');
        detailsDiv.innerHTML = `
            <div class="bearing-data">
                <p>Matching dimensions: d=${first.d} mm, D=${first.D} mm, B=${first.B} mm</p>
                <p><strong>Codes:</strong><br>${codeList}</p>
            </div>
            <div class="bearing-drawing">
                ${svg}
            </div>
        `;
    }
}

document.getElementById('codeInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') searchByCode();
});

document.getElementById('resultArea').classList.remove('active');

// ULTRA-EXPANDED BEARING DATASET: ~15,300 entries

const bearings = [];

function getBoreD(bc) {
    if (bc === 0) return 10;
    if (bc === 1) return 12;
    if (bc === 2) return 15;
    if (bc === 3) return 17;
    return bc * 5;
}

// Interpolate value based on bore code (bc) and breakpoints
function interpolate(bc, breakBc, values) {
    if (bc <= breakBc[0]) return values[0];
    for (let i = 1; i < breakBc.length; i++) {
        if (bc <= breakBc[i]) {
            const t = (bc - breakBc[i-1]) / (breakBc[i] - breakBc[i-1]);
            return Math.round(values[i-1] + t * (values[i] - values[i-1]));
        }
    }
    return values[values.length - 1];
}

// Helper: generate all integer bore codes from minBc to maxBc
function generateSeries(prefix, type, breakBc, Dvals, Bvals, minBc, maxBc) {
    for (let bc = minBc; bc <= maxBc; bc++) {
        const d = getBoreD(bc);
        const D = interpolate(bc, breakBc, Dvals);
        const B = interpolate(bc, breakBc, Bvals);
        const code = prefix + (bc < 10 ? '0' + bc : bc);
        bearings.push({ code, type, d, D, B });
    }
}

// Drawing function (unchanged, works fine)
function drawBearing(d, D, B) {
    const scale = 1.4;
    const outerR = D/2 * scale;
    const innerR = d/2 * scale;
    const width = Math.max(B * scale, 20);
    const svgWidth = Math.max(outerR*2 + 180, 320);
    const svgHeight = Math.max(outerR*2 + 90, 210);
    let svg = `<svg width="${svgWidth}" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}" xmlns="http://www.w3.org/2000/svg">
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2c5282"/></marker></defs>`;
    const cx = outerR + 22;
    const cy = outerR + 28;
    svg += `<circle cx="${cx}" cy="${cy}" r="${outerR}" fill="none" stroke="#1e4668" stroke-width="1.8"/>`;
    svg += `<circle cx="${cx}" cy="${cy}" r="${innerR}" fill="none" stroke="#1e4668" stroke-width="1.6" stroke-dasharray="5,3"/>`;
    svg += `<text x="${cx}" y="${cy - outerR - 6}" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f2c44">D = ${D} mm</text>`;
    svg += `<text x="${cx}" y="${cy - innerR + 12}" text-anchor="middle" font-size="11" fill="#2d6a4f">d = ${d} mm</text>`;
    const sideX = cx + outerR + 48;
    const sideY = cy - outerR;
    svg += `<rect x="${sideX}" y="${sideY}" width="${width}" height="${outerR*2}" fill="none" stroke="#1e4668" stroke-width="1.8" rx="3"/>`;
    svg += `<line x1="${sideX}" y1="${sideY + outerR - innerR}" x2="${sideX + width}" y2="${sideY + outerR - innerR}" stroke="#2c5282" stroke-dasharray="5,3" stroke-width="1.4"/>`;
    svg += `<line x1="${sideX}" y1="${sideY + outerR + innerR}" x2="${sideX + width}" y2="${sideY + outerR + innerR}" stroke="#2c5282" stroke-dasharray="5,3" stroke-width="1.4"/>`;
    svg += `<line x1="${sideX}" y1="${sideY + outerR}" x2="${sideX + width}" y2="${sideY + outerR}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>`;
    svg += `<line x1="${sideX}" y1="${sideY - 12}" x2="${sideX + width}" y2="${sideY - 12}" stroke="#1e4668" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>`;
    svg += `<text x="${sideX + width/2}" y="${sideY - 16}" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f2c44">B = ${B} mm</text>`;
    svg += `<line x1="${sideX - 12}" y1="${sideY}" x2="${sideX - 12}" y2="${sideY + outerR*2}" stroke="#1e4668" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>`;
    svg += `<text x="${sideX - 24}" y="${sideY + outerR}" text-anchor="end" font-size="11" font-weight="bold" transform="rotate(-90, ${sideX-24}, ${sideY+outerR})" fill="#0f2c44">D = ${D}</text>`;
    svg += `<line x1="${sideX + width + 14}" y1="${sideY + outerR - innerR}" x2="${sideX + width + 14}" y2="${sideY + outerR + innerR}" stroke="#1e4668" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>`;
    svg += `<text x="${sideX + width + 20}" y="${sideY + outerR}" text-anchor="start" font-size="11" font-weight="bold" fill="#2d6a4f">d = ${d}</text>`;
    svg += `</svg>`;
    return svg;
}

function displayResult(bearing, multiple = null) {
    const resultDiv = document.getElementById('resultArea');
    const detailsDiv = document.getElementById('bearingDetails');
    const titleElem = document.getElementById('resultTitle');
    resultDiv.classList.add('active');
    if (!bearing && !multiple) {
        titleElem.textContent = '❌ No bearing found';
        detailsDiv.innerHTML = '<div class="error">No matching bearing in database (15k+ entries). Try another code or dimensions.</div>';
        return;
    }
    if (multiple && multiple.length > 1) {
        titleElem.textContent = `🔁 Multiple bearings found (${multiple.length} matches)`;
        const first = multiple[0];
        const svg = drawBearing(first.d, first.D, first.B);
        let codesHtml = multiple.map(b => `<div><strong>${b.code}</strong> (${b.type})</div>`).join('');
        detailsDiv.innerHTML = `
            <div class="bearing-data">
                <div class="badge-multiple">Dimensions: d=${first.d} mm, D=${first.D} mm, B=${first.B} mm</div>
                <p><strong>📌 Matching bearing codes:</strong></p>
                ${codesHtml}
            </div>
            <div class="bearing-drawing">${svg}</div>
        `;
        return;
    }
    const b = multiple ? multiple[0] : bearing;
    titleElem.textContent = `✅ Bearing found — ${b.code}`;
    const svg = drawBearing(b.d, b.D, b.B);
    detailsDiv.innerHTML = `
        <div class="bearing-data">
            <table><tr><th>Bearing Code</th><td><strong style="font-size:1.2rem;">${b.code}</strong></td></tr>
            <tr><th>Type</th><td>${b.type}</td></tr>
            <tr><th>Inner diameter (d)</th><td>${b.d} mm</td></tr>
            <tr><th>Outer diameter (D)</th><td>${b.D} mm</td></tr>
            <tr><th>Width (B)</th><td>${b.B} mm</td></tr></table>
        </div>
        <div class="bearing-drawing">${svg}</div>
    `;
}

function searchByCode() {
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (!code) { displayResult(null); return; }
    const found = bearings.find(b => b.code === code);
    displayResult(found);
}

function searchByDimensions() {
    const typeFilter = document.getElementById('typeSelect').value;
    const dVal = parseFloat(document.getElementById('idInput').value);
    const DVal = parseFloat(document.getElementById('odInput').value);
    const BVal = parseFloat(document.getElementById('wInput').value);
    if (isNaN(dVal) || isNaN(DVal) || isNaN(BVal)) { displayResult(null); return; }
    let filtered = bearings.filter(b => Math.abs(b.d - dVal) < 0.5 && Math.abs(b.D - DVal) < 0.5 && Math.abs(b.B - BVal) < 0.5);
    if (typeFilter !== 'all') filtered = filtered.filter(b => b.type === typeFilter);
    if (filtered.length === 0) displayResult(null);
    else if (filtered.length === 1) displayResult(filtered[0]);
    else displayResult(null, filtered);
}

// attach event listeners
document.getElementById('codeInput').addEventListener('keypress', e => { if (e.key === 'Enter') searchByCode(); });
document.getElementById('idInput').addEventListener('keypress', e => { if (e.key === 'Enter') searchByDimensions(); });
document.getElementById('odInput').addEventListener('keypress', e => { if (e.key === 'Enter') searchByDimensions(); });
document.getElementById('wInput').addEventListener('keypress', e => { if (e.key === 'Enter') searchByDimensions(); });
</script>
